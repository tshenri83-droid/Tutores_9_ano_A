<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutores_9_ano_A</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc,#e0f2fe);color:#172033;min-height:100vh}
header{padding:45px 20px;text-align:center;color:white;background:linear-gradient(135deg,#312e81,#4f46e5,#2563eb)}
header h1{font-size:clamp(2.2rem,7vw,4rem);margin-bottom:10px}
header p{opacity:.9}
main{max-width:1050px;margin:auto;padding:30px 18px 60px}
.topbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.topbar button{width:auto;padding:12px 18px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
button{border:0;width:100%;padding:22px;border-radius:20px;background:white;box-shadow:0 10px 25px #00000012;text-align:left;cursor:pointer;transition:.25s}
button:hover{transform:translateY(-3px);box-shadow:0 16px 30px #0000001c}
.icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:22px;margin-bottom:13px}
button h3{font-size:20px;margin-bottom:5px;color:#111827}
button span{color:#64748b;font-size:14px}
.page{display:none;max-width:650px;margin:auto}
.back{width:auto;background:#e0e7ff;color:#3730a3;padding:11px 17px;margin-bottom:22px;font-weight:bold}
.profile{text-align:center;background:white;padding:28px 22px;border-radius:25px;box-shadow:0 12px 30px #00000012}
.bigicon{margin:auto auto 15px;width:80px;height:80px;border-radius:25px;background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:bold}
.profile h2{font-size:30px;color:#1e1b4b;margin-bottom:8px}
.profile p{color:#64748b;margin-bottom:20px}
.students{display:grid;gap:12px;text-align:left}
.student{padding:15px 18px;background:#f8fafc;border-radius:14px;font-weight:600;color:#334155}
.student:before{content:"👤";margin-right:10px}
footer{text-align:center;color:#64748b;padding:25px}
#loginBox{max-width:420px;margin:35px auto;background:white;padding:28px 22px;border-radius:22px;box-shadow:0 12px 30px #00000012}
#loginBox input{width:100%;padding:13px;border-radius:12px;border:1px solid #cbd5e1;margin:7px 0 10px;font-size:16px}
.primary{background:#4f46e5!important;color:white!important;text-align:center!important;font-weight:bold}
.danger{background:#fee2e2!important;color:#991b1b!important;text-align:center!important;font-weight:bold}
.status{font-size:14px;margin-top:10px;min-height:20px}
</style>
</head>
<body>
<header>
<h1>9º Ano A</h1>
<p>Tutores de Matemática</p>
</header>

<main>
<section id="loginBox">
<h2 style="color:#1e1b4b;margin-bottom:8px">🔐 Entrar</h2>
<p style="margin-bottom:16px">Entre com o e-mail e a senha criados no Firebase para este site.</p>
<input id="loginEmail" type="email" placeholder="Seu e-mail">
<input id="loginPassword" type="password" placeholder="Senha do site">
<button class="primary" onclick="login()">Entrar</button>
<div id="loginStatus" class="status"></div>
</section>

<section id="appArea" style="display:none">
<div class="topbar">
<button id="editAllBtn" class="primary" onclick="openEditor()" style="display:none">✏️ Editar alunos</button>
<button onclick="logout()" style="width:auto;padding:12px 18px">Sair</button>
</div>

<section id="home">
<h2 style="text-align:center;margin-bottom:25px;color:#1e1b4b">👥 Nossos Tutores</h2>
<div class="grid">
<button onclick="openPage('Diego',['Fernanda','Laura','Camilly'])"><div class="icon">D</div><h3>Diego</h3><span>3 tutorados</span></button>
<button onclick="openPage('Ícaro',['Thiago','Miguel','Melissa'])"><div class="icon">Í</div><h3>Ícaro</h3><span>3 tutorados</span></button>
<button onclick="openPage('Eduardo',['Davi','Cristian','Maria Edu'])"><div class="icon">E</div><h3>Eduardo</h3><span>3 tutorados</span></button>
<button onclick="openPage('Mariah',['Lara','Julia','Yuri'])"><div class="icon">M</div><h3>Mariah</h3><span>3 tutorados</span></button>
<button onclick="openPage('Camila',['Ana Clara','Bryan','Giovanna'])"><div class="icon">C</div><h3>Camila</h3><span>3 tutorados</span></button>
<button onclick="openPage('Murillo',['Lorena','Luiz'])"><div class="icon">M</div><h3>Murillo</h3><span>2 tutorados</span></button>
<button onclick="openPage('Felippe M',['Isabela','Paulo','Beatriz Y'])"><div class="icon">F</div><h3>Felippe M</h3><span>3 tutorados</span></button>
<button onclick="openPage('Tiago',['Myrella','Nathalya','Wilson'])"><div class="icon">T</div><h3>Tiago</h3><span>3 tutorados</span></button>
<button onclick="openPage('Ana Heloísa',['Kenan','Felippe S','Yasmin'])"><div class="icon">A</div><h3>Ana Heloísa</h3><span>3 tutorados</span></button>
</div>
</section>

<section id="editor" class="page">
<button class="back" onclick="goHome()">← Voltar</button>
<div class="profile">
<h2 style="margin-bottom:8px">Editar aluno</h2>
<p>Escolha um aluno e escreva as características dele.</p>
<select id="editStudent" style="width:100%;padding:13px;border-radius:12px;border:1px solid #cbd5e1;margin-bottom:12px;font-size:16px"></select>
<textarea id="editTraits" placeholder="Digite aqui as características do aluno..." style="display:block;width:100%;min-height:160px;padding:13px;border-radius:12px;border:1px solid #cbd5e1;background:white;color:#172033;font-family:Arial;font-size:16px;resize:vertical"></textarea>
<button onclick="saveTraits()" class="primary" style="margin-top:12px">💾 Salvar características</button>
<div id="savedMsg" class="status"></div>
</div>
</section>

<section id="page" class="page">
<button class="back" onclick="goHome()">← Voltar</button>
<div class="profile">
<div class="bigicon" id="avatar"></div>
<h2 id="name"></h2>
<p>Lista de tutorados</p>
<div class="students" id="students"></div>
<div id="studentProfile" style="display:none;margin-top:18px;background:#eef2ff;border-radius:18px;padding:20px;text-align:left">
<h3 id="studentName" style="color:#312e81;margin-bottom:10px"></h3>
<p id="studentTraits" style="color:#475569;line-height:1.7;white-space:pre-line"></p>
<button id="quickEditButton" onclick="editCurrentStudent()" class="primary" style="margin-top:15px">✏️ Editar características</button>
<div id="quickEdit" style="display:none;margin-top:14px">
<textarea id="quickTraits" placeholder="Digite as características do aluno..." style="width:100%;min-height:130px;padding:13px;border-radius:12px;border:1px solid #cbd5e1;font-family:Arial;font-size:16px;resize:vertical"></textarea>
<button onclick="saveCurrentStudent()" style="margin-top:10px;background:#16a34a;color:white;text-align:center;font-weight:bold">💾 Salvar</button>
</div>
</div>
</div>
</section>
</section>
</main>
<footer>© 2026 • Portfólio de Tutoria</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOnKw3lQ9wTgwlpniE9OmxwIwtsm9oASk",
  authDomain: "tutores-9-ano-a.firebaseapp.com",
  databaseURL: "https://tutores-9-ano-a-default-rtdb.firebaseio.com",
  projectId: "tutores-9-ano-a",
  storageBucket: "tutores-9-ano-a.firebasestorage.app",
  messagingSenderId: "746563720937",
  appId: "1:746563720937:web:d71b4fef9bfdd6d8888278",
  measurementId: "G-SZQ7XHZ0PN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const allStudents = ['Fernanda','Laura','Camilly','Thiago','Miguel','Melissa','Davi','Cristian','Maria Edu','Lara','Julia','Yuri','Ana Clara','Bryan','Giovanna','Lorena','Luiz','Isabela','Paulo','Beatriz Y','Myrella','Nathalya','Wilson','Kenan','Felippe S','Yasmin'];
let currentStudent = '';
let currentRole = 'student';

window.login = async function(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const status=document.getElementById('loginStatus');
  if(!email || !password){
    status.textContent='❌ Digite o e-mail e a senha.';
    return;
  }
  status.textContent='Entrando...';
  try{
    const result = await Promise.race([
      signInWithEmailAndPassword(auth,email,password),
      new Promise((_, reject)=>setTimeout(()=>reject(new Error('TIMEOUT_LOGIN')),12000))
    ]);
    status.textContent='✓ Login realizado!';
  }catch(e){
    console.error(e);
    const code=e?.code || '';
    if(code==='auth/invalid-credential' || code==='auth/wrong-password' || code==='auth/user-not-found'){
      status.textContent='❌ E-mail ou senha incorretos.';
    }else if(code==='auth/invalid-email'){
      status.textContent='❌ Esse e-mail não é válido.';
    }else if(code==='auth/network-request-failed' || e?.message==='TIMEOUT_LOGIN'){
      status.textContent='❌ O Firebase não respondeu. Verifique a internet e tente novamente.';
    }else{
      status.textContent='❌ Erro do Firebase: '+(e?.message || 'tente novamente.');
    }
  }
};

window.logout = function(){ signOut(auth); };

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    document.getElementById('loginBox').style.display='block';
    document.getElementById('appArea').style.display='none';
    return;
  }
  document.getElementById('loginBox').style.display='none';
  document.getElementById('appArea').style.display='block';
  await loadRole(user.uid);
});

async function loadRole(uid){
  currentRole='student';
  try{
    const snap=await get(ref(db,'users/'+uid+'/role'));
    if(snap.exists()) currentRole=snap.val();
  }catch(e){}
  document.getElementById('editAllBtn').style.display=(currentRole==='admin'||currentRole==='teacher')?'block':'none';
  document.getElementById('quickEditButton').style.display=(currentRole!=='student')?'block':'none';
}

function canEditStudent(name){
  if(currentRole==='admin'||currentRole==='teacher') return true;
  if(currentRole==='tutor'){
    return false; // será liberado depois que o vínculo tutor -> tutorados for cadastrado
  }
  return false;
}

window.openEditor = function(){
  if(!(currentRole==='admin'||currentRole==='teacher')) return;
  document.getElementById('home').style.display='none';
  document.getElementById('page').style.display='none';
  document.getElementById('editor').style.display='block';
  const select=document.getElementById('editStudent');
  select.innerHTML=allStudents.map(s=>`<option>${s}</option>`).join('');
  loadTraits();
  select.onchange=loadTraits;
  window.scrollTo(0,0);
};

function loadTraits(){
  const name=document.getElementById('editStudent').value;
  onValue(ref(db,'traits/'+name), snap=>{
    document.getElementById('editTraits').value=snap.val() || '';
    document.getElementById('savedMsg').textContent='';
  }, {onlyOnce:true});
}

window.saveTraits = async function(){
  const name=document.getElementById('editStudent').value;
  if(!(currentRole==='admin'||currentRole==='teacher')) return;
  try{
    await set(ref(db,'traits/'+name),document.getElementById('editTraits').value);
    document.getElementById('savedMsg').textContent='✓ Salvo no Firebase! Todos verão a alteração.';
  }catch(e){
    document.getElementById('savedMsg').textContent='❌ Não foi possível salvar.';
  }
};

window.openPage = function(name, students){
  document.getElementById('home').style.display='none';
  document.getElementById('editor').style.display='none';
  document.getElementById('page').style.display='block';
  document.getElementById('name').textContent=name;
  document.getElementById('avatar').textContent=name.charAt(0);
  document.getElementById('studentProfile').style.display='none';
  document.getElementById('students').innerHTML=students.map(s=>
    `<div class="student" onclick="showStudent('${s.replace(/'/g,"\\'")}')" style="cursor:pointer">${s}</div>`
  ).join('');
  window.scrollTo(0,0);
};

window.showStudent = function(name){
  currentStudent=name;
  document.getElementById('quickEdit').style.display='none';
  document.getElementById('studentProfile').style.display='block';
  document.getElementById('studentName').textContent='🌟 '+name;
  onValue(ref(db,'traits/'+name),snap=>{
    document.getElementById('studentTraits').textContent=snap.val() || 'Ainda não há características cadastradas.';
  });
  document.getElementById('quickEditButton').style.display=canEditStudent(name)?'block':'none';
  document.getElementById('studentProfile').scrollIntoView({behavior:'smooth',block:'nearest'});
};

window.editCurrentStudent = function(){
  if(!canEditStudent(currentStudent)) return;
  document.getElementById('quickEdit').style.display='block';
  get(ref(db,'traits/'+currentStudent)).then(snap=>{
    document.getElementById('quickTraits').value=snap.val() || '';
    document.getElementById('quickTraits').focus();
  });
};

window.saveCurrentStudent = async function(){
  if(!canEditStudent(currentStudent)) return;
  try{
    await set(ref(db,'traits/'+currentStudent),document.getElementById('quickTraits').value);
    document.getElementById('studentTraits').textContent=document.getElementById('quickTraits').value || 'Ainda não há características cadastradas.';
    document.getElementById('quickEdit').style.display='none';
  }catch(e){
    alert('Não foi possível salvar no Firebase.');
  }
};

window.goHome = function(){
  document.getElementById('page').style.display='none';
  document.getElementById('editor').style.display='none';
  document.getElementById('home').style.display='block';
  window.scrollTo(0,0);
};
</script>
</body>
</html>
